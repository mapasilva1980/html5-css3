<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="isxmas"> <label for="isxmas">Masculino</label> <br>
        <input type="radio" name="sexo" id="isfem"> <label for="isfem">Feminino</label>
    </fieldset>
    <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="radio" name="esporte" id="iesbas"> <label for="iesbas">Basquete</label> <br>
        <input type="radio" name="esporte" id="iesfut"> <label for="iesfut">Futebol</label> <br>
        <input type="radio" name="esporte" id="iesnat"> <label for="iesnat">Natação</label> <br>
        <input type="radio" name="esporte" id="iesten"> <label for="iesten">Tênis</label> <br> 
    </fieldset>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
