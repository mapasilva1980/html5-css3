<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p {
            display: none;
        }

        div:hover > p {
            display: block;
            background-color: red;
            color: white;
            font-size: 100px;
            height: 500px;
            width: 400px;
        }

        div:hover {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Não passe o mouse sobre o texto abaixo</p>
    <div>Não passe o mouse aqui
        <p>RÁ!!! SEU BOBO!!!</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
